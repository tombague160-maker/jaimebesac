## jaimebesac — reverse proxy SWAG (nginx)
# À placer dans /config/nginx/proxy-confs/jaimebesac.subdomain.conf sur ton SWAG.
#
# Prérequis :
#   - un CNAME DNS pour le sous-domaine (ici "besac", change-le si tu veux),
#   - le certificat SWAG doit couvrir ce sous-domaine (wildcard, ou ajoute "besac"
#     à SUBDOMAINS dans le compose de SWAG),
#   - l'app jaimebesac tourne sur l'OMV : ici IP hôte 192.168.1.34, port 8083.
#
# ⚠️ Une fois derrière ce HTTPS : dans le compose jaimebesac, ENLÈVE
#    "COOKIE_SECURE=false" (ou mets-le à true) puis "docker compose up -d",
#    pour que le cookie de session redevienne Secure.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name besac.*;

    include /config/nginx/ssl.conf;

    # Les sauvegardes de l'espace de travail peuvent atteindre ~2 Mo (défaut nginx = 1 Mo).
    client_max_body_size 10m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.1.34;
        set $upstream_port 8083;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
